# Автообновление пакета в winget: при публикации релиза открывает PR
# в microsoft/winget-pkgs с новой версией (через WinGet Releaser / Komac).
# Крутится на раннерах GitHub Actions — свой сервер не нужен.
#
# Требуется один раз:
#   1. Классический PAT с правом public_repo → секрет репозитория WINGET_TOKEN.
#   2. Форк https://github.com/microsoft/winget-pkgs на своём аккаунте.
#   3. Первая версия пакета уже должна быть принята в winget-pkgs (ручной PR).
name: winget

on:
  release:
    types: [released]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Тег релиза для публикации (напр. v0.7.0)'
        required: true

jobs:
  publish:
    runs-on: windows-latest
    env:
      HAS_TOKEN: ${{ secrets.WINGET_TOKEN != '' }}
    steps:
      - uses: actions/checkout@v7 # ради .github/scripts (winget-releaser чекаут не нужен)
        if: env.HAS_TOKEN == 'true'
      - name: Publish to winget
        if: env.HAS_TOKEN == 'true'
        uses: vedantmgoyal9/winget-releaser@v2
        with:
          identifier: Oksion.XiControl
          installers-regex: '-win-x64\.exe$' # только самодостаточный exe (без -net8)
          # тег: из ввода при ручном запуске, иначе из события release
          release-tag: ${{ inputs.tag || github.event.release.tag_name }}
          token: ${{ secrets.WINGET_TOKEN }}
      # Komac пересобирает installer-манифест из exe и теряет рукописные поля —
      # MinimumOSVersion уезжал в 0.7.0 и 0.8.0, валидатор winget без него режет PR.
      # Возвращаем поля прямо в ветку форка (PR обновится сам); скрипт идемпотентен.
      - name: Restore hand-written manifest fields
        if: env.HAS_TOKEN == 'true'
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.WINGET_TOKEN }}
        run: ./.github/scripts/winget-restore-fields.ps1 -Tag '${{ inputs.tag || github.event.release.tag_name }}'
      - name: No token — skip
        if: env.HAS_TOKEN != 'true'
        run: echo "Секрет WINGET_TOKEN не задан — публикация в winget пропущена."
